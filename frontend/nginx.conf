server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable client keep-alive. Reused connections were desyncing after
    # JSON POSTs so the following multipart image upload arrived mid-stream
    # and nginx answered with a generic 400 Bad Request.
    keepalive_timeout 0;

    # SPA fallback — never cache the shell so clients pick up API fixes
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health + media to FastAPI
    # ^~ prevents the static-file regex below from intercepting API media
    # paths such as /api/v1/media/purchases/.../image.jpg.
    location ^~ /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "close";
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        client_max_body_size 20m;
        client_body_buffer_size 20m;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "close";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
