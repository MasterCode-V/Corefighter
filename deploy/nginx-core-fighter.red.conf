# Host nginx: terminate TLS and proxy to Docker frontend (port 5173).
# Frontend container already proxies /api → FastAPI.

upstream cf_frontend {
    server 127.0.0.1:5173;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name core-fighter.red www.core-fighter.red;

    # ACME HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name core-fighter.red www.core-fighter.red;

    ssl_certificate     /etc/letsencrypt/live/core-fighter.red/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core-fighter.red/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://cf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Match frontend container: avoid keep-alive desync on uploads
        proxy_set_header Connection "close";
        proxy_read_timeout 300s;
        proxy_request_buffering on;    }
}
